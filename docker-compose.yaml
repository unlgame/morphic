# Docker Compose configuration for the morphic-stack development environment
services:
  morphic:
    image: ghcr.io/unlgame/morphic:latest
    command: node node_modules/next/dist/bin/next start -H 0.0.0.0
    env_file: .env
    environment:
      # Database connection for Docker Compose (override any cloud DB from .env.local)
      DATABASE_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
      DATABASE_RESTRICTED_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
      DATABASE_SSL_DISABLED: 'true' # Disable SSL for local Docker PostgreSQL
      # Authentication settings (default: disabled for personal Docker use)
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      ANONYMOUS_USER_ID: ${ANONYMOUS_USER_ID:-docker-anonymous}
      MORPHIC_CLOUD_DEPLOYMENT: 'false'
      # Docker-internal service URLs
      LOCAL_REDIS_URL: ${LOCAL_REDIS_URL:-redis://redis:6379}
      SEARCH_API: ${SEARCH_API:-tavily}
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morphic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphic}
      POSTGRES_DB: ${POSTGRES_DB:-morphic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-morphic}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
